<text x="64" y="105" font-size="40" fill="#e9eef7" font-weight="700" text-anchor="start">WannaCry, from delivery to recovery.</text>
<text x="64" y="140" font-size="19" fill="#a4b3ca" font-weight="400" text-anchor="start">Two human roles. One on-chain exchange. Five documents restored.</text>
