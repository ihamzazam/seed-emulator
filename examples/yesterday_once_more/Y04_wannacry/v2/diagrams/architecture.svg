<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
<title id="title">WannaCry incident lab — architecture and incident flow</title>
<desc id="desc">An attacker delivers a public key to the victim inbox. Five fixture documents are encrypted locally. The victim pays exactly one lab ETH to RansomExchange on a private Ethereum chain. The attacker posts a sealed reply; the victim retrieves it and recovers the documents locally. Supporting infrastructure includes a faucet, utility server, and SEED map.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#243248" opacity=".45"/></pattern>
<marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ff947f" stroke-width="1.5"/></marker>
<marker id="cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#6be4dc" stroke-width="1.5"/></marker>
<marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b5a1ff" stroke-width="1.5"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b4e68a" stroke-width="1.5"/></marker>
</defs><rect width="1600" height="1020" rx="24" fill="#0b1220"/><rect width="1600" height="1020" fill="url(#grid)"/>
