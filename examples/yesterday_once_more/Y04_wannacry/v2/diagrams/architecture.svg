<text x="600" y="276" font-size="16" fill="#a4b3ca" font-weight="400" text-anchor="start">10.180.0.71</text>
<text x="600" y="307" font-size="16" fill="#e9eef7" font-weight="400" text-anchor="start">Delivery inbox :4450 · participant menu</text>
<text x="600" y="332" font-size="16" fill="#e9eef7" font-weight="400" text-anchor="start">Five documents · encrypted wallet</text>
<text x="600" y="353" font-size="13" fill="#6be4dc" font-weight="400" text-anchor="start">File key and recovery stay local.</text>
<rect x="1088" y="183" width="448" height="188" rx="16" fill="#121e30" stroke="#2a384f"/>
<rect x="1089" y="200" width="3" height="33" rx="1" fill="#b5a1ff"/>
