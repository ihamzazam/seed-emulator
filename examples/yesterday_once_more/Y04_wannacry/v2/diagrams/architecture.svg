<text x="1112" y="307" font-size="16" fill="#e9eef7" font-weight="400" text-anchor="start">registerVictim: exactly 1 lab ETH</text>
<text x="1112" y="332" font-size="16" fill="#e9eef7" font-weight="400" text-anchor="start">submitReply: attacker identity only</text>
<text x="1112" y="353" font-size="13" fill="#b5a1ff" font-weight="400" text-anchor="start">Only opaque sealed key material on-chain.</text>
