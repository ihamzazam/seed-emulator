<rect x="65" y="200" width="3" height="33" rx="1" fill="#ff947f"/>
<text x="88" y="214" font-size="13" fill="#ff947f" font-weight="700" text-anchor="start">01  /  ATTACKER</text>
<text x="88" y="249" font-size="27" fill="#e9eef7" font-weight="700" text-anchor="start">host_1</text>
<text x="88" y="276" font-size="16" fill="#a4b3ca" font-weight="400" text-anchor="start">10.180.0.72</text>
<text x="88" y="307" font-size="16" fill="#e9eef7" font-weight="400" text-anchor="start">Deliver the public key · watch requests</text>
<text x="88" y="332" font-size="16" fill="#e9eef7" font-weight="400" text-anchor="start">Post sealed replies · withdraw funds</text>
<text x="88" y="353" font-size="13" fill="#ff947f" font-weight="400" text-anchor="start">RSA private key stays on this host.</text>
<rect x="576" y="183" width="448" height="188" rx="16" fill="#121e30" stroke="#2a384f"/>
<rect x="577" y="200" width="3" height="33" rx="1" fill="#6be4dc"/>
